<div id="player-concept">
<style>
#player-concept{font:14px/1.5 system-ui,sans-serif;--bg:#f4f4f4;--panel:#fff;--ink:#202020;--dim:#747474;--line:#dedede;--accent:#777777;color:var(--ink)}
#player-concept *{box-sizing:border-box}
#player-concept button{font:inherit;color:inherit;background:none;border:0;border-radius:12px;min-height:44px;padding:10px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
#player-concept button:hover{background:var(--line)}
#player-concept .app{background:var(--bg);border:1px solid var(--line);border-radius:28px;padding:12px;display:grid;grid-template-columns:166px minmax(0,1fr);gap:14px}
#player-concept .sidebar{border-radius:22px;padding:20px 12px 8px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(135deg,#ffffffaa,#ffffff18 60%,#ffffff55);border:1px solid #ffffff88;backdrop-filter:blur(24px);box-shadow:inset 0 1px 1px #ffffffaa,0 5px 22px #00000005;min-height:480px}
#player-concept .brand{font-size:21px;font-weight:500;letter-spacing:-1px;padding:0 12px 20px}
#player-concept .sidebar button{justify-content:flex-start;text-align:left}
#player-concept .sidebar .active{background:color-mix(in srgb,var(--panel) 65%,transparent)}
#player-concept .settings-button{margin-top:auto}
#player-concept .workspace{padding:16px 16px 8px;min-width:0;position:relative}
#player-concept .header{display:flex;align-items:center;justify-content:center;gap:16px;padding:0 72px 0 0;min-height:52px;margin-bottom:18px}
#player-concept h2{font-size:23px;font-weight:500;letter-spacing:-.7px;margin:0;overflow-wrap:anywhere}
#player-concept .theme-switch{width:58px;min-width:58px;min-height:32px;height:32px;border-radius:30px;padding:3px;background:var(--line);justify-content:flex-start}
#player-concept .theme-switch .thumb{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--panel);box-shadow:0 2px 5px #00000012;transition:transform .18s}
#player-concept .theme-switch[aria-checked=true] .thumb{transform:translateX(26px)}
#player-concept .theme-switch svg{width:16px;height:16px}
#player-concept .muted{color:var(--dim);font-size:12px}
#player-concept .tabs{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:18px 0}
#player-concept .tabs button[aria-pressed=true]{background:var(--panel)}
#player-concept .track{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) 42px 38px;gap:14px;align-items:center;padding:9px 10px 9px 20px;border-radius:15px;touch-action:pan-y}
#player-concept .menu-toggle{cursor:grab;touch-action:none}
#player-concept .menu-toggle:active{cursor:grabbing}
#player-concept .track.dragging{opacity:.45}
#player-concept .track.current{background:var(--panel)}
#player-concept .cover{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#b0b0b0,#343434);display:grid;place-items:center;color:#fff}
#player-concept .cover.alt{background:linear-gradient(135deg,#ddd,#7d7d7d)}
#player-concept .song{font-weight:500}
#player-concept .track-menu{position:absolute;right:6px;top:50px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 12px 30px #00000018;min-width:210px;animation:pc-in .15s ease-out}
#player-concept .track-menu button{display:flex;justify-content:flex-start;width:100%}
#player-concept .new-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#player-concept .search{display:flex;align-items:center;gap:10px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--dim)}
#player-concept .search input[type=text]{border:0;background:transparent;padding:12px 0;width:100%;color:var(--ink)}
#player-concept .new-list:not([hidden]){animation:pc-in .18s ease-out}
#player-concept input[type=text]{font:inherit;min-width:0;flex:1;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:10px;border-radius:12px}
#player-concept .footer{grid-column:1/-1;display:grid;position:relative;grid-template-columns:96px minmax(0,1fr) 76px;align-items:center;gap:28px;padding:20px;border-radius:32px;background:var(--panel);border:1px solid var(--line)}
#player-concept .glass-cover{position:relative;width:96px;height:96px;transform:translateX(36px);border-radius:12px;isolation:isolate;color:var(--ink);background:linear-gradient(135deg,#ffffff99,#ffffff0a 55%,#ffffff44);border:1px solid #ffffff66;box-shadow:inset 0 1px 5px #ffffff44,0 3px 12px #00000008;backdrop-filter:blur(20px)}
#player-concept .glass-cover:before{content:'';position:absolute;inset:14px 22px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#99999922);filter:blur(14px);z-index:-1}
#player-concept .glass-cover svg{width:28px;height:28px;opacity:.75}
#player-concept .player-center{width:100%;min-width:0}
#player-concept .player-center .title,#player-concept .player-center .controls{width:100%;margin-left:auto;margin-right:auto}
#player-concept .title{text-align:center;margin-bottom:5px}
#player-concept .controls{display:flex;align-items:center;justify-content:center;gap:8px;position:relative}
#player-concept .play{width:44px;border-radius:50%;background:var(--ink);color:var(--panel)}
#player-concept .controls .mode{position:absolute;left:calc(50% - 128px);margin:0}
#player-concept .controls .volume-button{position:absolute;right:calc(50% - 128px);margin:0}
#player-concept .volume-popover{position:absolute;right:calc(50% - 148px);bottom:52px;z-index:9;width:190px;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px #00000018;animation:pc-in .15s ease-out}
#player-concept .volume-label{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--dim);font-size:12px}
#player-concept .volume-popover input{width:100%;margin:0;accent-color:var(--ink);min-height:24px}
#player-concept .controls>span{display:none}
#player-concept .seek{height:28px;position:relative;margin-top:4px}
#player-concept .rail{position:absolute;inset:13px 0 auto;height:2px;background:var(--line);border-radius:4px}
#player-concept .filled{position:absolute;inset:13px auto auto 0;width:32%;height:2px;background:var(--ink)}
#player-concept .seek input{position:absolute;inset:0;margin:0;width:100%;height:28px;background:transparent;appearance:none;accent-color:#202020}
#player-concept .seek input::-webkit-slider-runnable-track{height:2px;background:transparent}
#player-concept .seek input::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;background:transparent;margin-top:-9px}
#player-concept .seek input::-moz-range-track{height:2px;background:transparent}
#player-concept .seek input::-moz-range-thumb{width:20px;height:20px;border:0;background:transparent}
#player-concept .seek-thumb{position:absolute;width:12px;height:12px;left:32%;top:14px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--knob-edge,#171717);background:var(--knob-fill,#fff);box-shadow:0 0 0 2px var(--panel);pointer-events:none}
#player-concept .wave{position:absolute;inset:5px 0;width:100%;height:18px;overflow:visible}
#player-concept .times{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
#player-concept .visualizer{position:relative;height:42px;width:76px;transform:translateX(-36px);color:var(--accent);opacity:.85;padding:0;border-radius:12px;background:transparent}
#player-concept .visualizer svg{display:block;width:100%;height:100%}
#player-concept .status{font-size:12px;color:var(--dim);min-height:22px;margin:14px 10px 0}
#player-concept .settings-panel{position:absolute;z-index:8;top:64px;left:12px;right:12px;border-radius:20px;background:var(--panel);border:1px solid var(--line);padding:18px;box-shadow:0 12px 32px #00000018}
#player-concept .settings-panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#player-concept .setting{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0;flex-wrap:wrap}
#player-concept select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
#player-concept [hidden]{display:none!important}
@keyframes pc-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#player-concept .track-menu{animation:none}#player-concept .theme-switch .thumb{transition:none}}
@media(max-width:600px){#player-concept .app{grid-template-columns:48px minmax(0,1fr);gap:6px;padding:8px}#player-concept .sidebar{padding:12px 3px 4px;min-height:460px;border-radius:16px}#player-concept .sidebar button{justify-content:center;padding:8px}#player-concept .sidebar .label,#player-concept .brand{display:none}#player-concept .workspace{padding:8px 3px}#player-concept .header{padding:0;gap:10px}#player-concept h2{font-size:20px}#player-concept .track{grid-template-columns:30px minmax(0,1fr) 32px;gap:7px;padding:8px 2px 8px 10px}#player-concept .track>.duration{display:none}#player-concept .cover{width:30px;height:30px}#player-concept .footer{grid-template-columns:40px minmax(0,1fr) 32px;gap:8px;padding:12px 8px}#player-concept .glass-cover{width:40px;height:40px;border-radius:12px}#player-concept .controls{gap:0}#player-concept .controls button{padding:7px}#player-concept .controls .mode{margin-right:2px}#player-concept .visualizer{height:30px}#player-concept .muted{font-size:11px}}
@media(max-width:760px){#player-concept .glass-cover{transform:translate(36px,-20px)}#player-concept .visualizer{transform:translate(-36px,-20px)}#player-concept .controls .mode{left:calc(50% - 116px)}}
@media(max-width:600px){#player-concept .footer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 24px;padding:12px;min-height:0;border-radius:24px}#player-concept .glass-cover{position:relative;transform:translateX(6px);grid-column:1;grid-row:1;width:40px;height:40px;border-radius:12px}#player-concept .visualizer{position:relative;transform:translateX(-6px);width:32px;justify-self:end;grid-column:2;grid-row:1;height:30px;border-radius:12px;padding:0}#player-concept .player-center{grid-column:1/-1;grid-row:2;width:100%}#player-concept .player-center .title,#player-concept .player-center .controls{width:100%}#player-concept .controls{gap:8px}#player-concept .controls .mode{left:calc(50% - 126px);margin:0}}
@media(max-width:760px) and (min-width:601px){#player-concept .controls .volume-button{right:calc(50% - 116px)}}
@media(max-width:600px){#player-concept .controls .volume-button{right:calc(50% - 126px)}#player-concept .volume-popover{right:0}}
</style>
<section class="app" aria-label="Макет музыкального плеера">
 <nav class="sidebar" aria-label="Функции плеера">
  <div class="brand">player.</div>
  <button class="active cursor-interaction" id="pc-home" type="button" aria-label="Моя музыка"><i data-lucide="music-2" aria-hidden="true"></i><span class="label">Моя музыка</span></button>
  <button id="pc-add-side" type="button" class="cursor-interaction" aria-label="Создать плейлист"><i data-lucide="list-plus" aria-hidden="true"></i><span class="label">Новый плейлист</span></button>
  <button id="pc-settings" class="settings-button cursor-interaction" type="button" aria-label="Настройки" aria-expanded="false"><i data-lucide="settings-2" aria-hidden="true"></i><span class="label">Настройки</span></button>
 </nav>
 <main class="workspace">
  <header class="header"><h2 id="pc-heading">Моя музыка</h2><button id="pc-theme" role="switch" aria-checked="false" aria-label="Тёмная тема" class="theme-switch cursor-interaction" type="button"><span class="thumb"><i data-lucide="sun" aria-hidden="true"></i></span></button></header>
  <div class="muted" id="pc-subtitle">Музыка / Local · 6 треков</div>
  <div class="tabs" id="pc-tabs" aria-label="Треки и плейлисты"><button id="pc-all" type="button" aria-pressed="true" class="cursor-interaction">Все треки</button><button id="pc-evening" type="button" aria-pressed="false" class="cursor-interaction">Вечер</button><button id="pc-add" type="button" class="cursor-interaction" aria-label="Создать плейлист"><i data-lucide="plus" aria-hidden="true"></i></button></div>
  <label class="search" id="pc-search-bar"><i data-lucide="search" aria-hidden="true"></i><input type="text" id="pc-search" aria-label="Поиск треков" placeholder="Поиск треков"></label>
  <form class="new-list" id="pc-form" hidden><input type="text" id="pc-name" aria-label="Название плейлиста" placeholder="Название плейлиста" maxlength="32" required><button type="submit" class="cursor-interaction">Создать</button><button id="pc-cancel-list" type="button" class="cursor-interaction" aria-label="Отменить создание плейлиста"><i data-lucide="x" aria-hidden="true"></i></button></form>
  <div id="pc-tracks"></div>
  <div id="pc-status" class="status" aria-live="polite">На паузе · позиция восстановлена</div>
  <section id="pc-settings-panel" class="settings-panel" aria-label="Настройки макета" hidden>
   <header><span>Настройки</span><button id="pc-close-settings" type="button" class="cursor-interaction" aria-label="Закрыть настройки"><i data-lucide="x" aria-hidden="true"></i></button></header>
   <label class="setting">Шкала воспроизведения<select id="pc-line-style"><option value="straight">Прямая</option><option value="wave">Волнистая</option></select></label>
   <label class="setting">Акцентный цвет<input id="pc-accent" type="color" value="#777777" aria-label="Акцентный цвет"></label>
  </section>
 </main>
 <footer class="footer" aria-label="Панель воспроизведения">
  <div class="cover glass-cover"><i data-lucide="audio-lines" aria-hidden="true"></i></div>
  <div class="player-center">
   <div class="title"><span id="pc-title">Тихий город</span><div class="muted" id="pc-artist">Север</div></div>
   <div class="controls"><button id="pc-mode" type="button" class="mode cursor-interaction" aria-label="Режим: по порядку"><i data-lucide="list-music" aria-hidden="true"></i></button><button id="pc-prev" type="button" class="cursor-interaction" aria-label="Предыдущий трек"><i data-lucide="skip-back" aria-hidden="true"></i></button><button id="pc-play" type="button" class="play cursor-interaction" aria-label="Пуск"><i data-lucide="play" aria-hidden="true"></i></button><button id="pc-next" type="button" class="cursor-interaction" aria-label="Следующий трек"><i data-lucide="skip-forward" aria-hidden="true"></i></button><span style="width:52px" aria-hidden="true"></span></div>
   <div class="seek"><div class="rail"></div><div class="filled"></div><svg class="wave" id="pc-wave" viewBox="0 0 460 18" preserveAspectRatio="none" aria-hidden="true" hidden><path id="pc-wave-base" fill="none" stroke="var(--wave-ink)" stroke-width="2"/><path id="pc-wave-path" fill="none" stroke="var(--wave-ink)" stroke-width="2"/></svg><input id="pc-seek" type="range" min="0" max="272" value="86" aria-label="Позиция воспроизведения" aria-valuetext="1 минута 26 секунд"><span class="seek-thumb" aria-hidden="true"></span></div>
   <div class="times"><span id="pc-time">1:26</span><span id="pc-duration">4:32</span></div>
  </div>
  <div class="visualizer" role="img" aria-label="Пример сплошного визуализатора звука"><svg viewBox="0 0 76 42" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 21 Q4 20 8 15 Q12 9 16 14 Q20 19 24 7 Q28 0 32 12 Q36 18 40 6 Q44 1 48 13 Q52 19 56 10 Q60 5 64 15 Q70 21 76 21 Q70 22 64 27 Q60 37 56 32 Q52 23 48 29 Q44 41 40 36 Q36 24 32 30 Q28 42 24 35 Q20 23 16 28 Q12 33 8 27 Q4 22 0 21 Z"/></svg></div>
 </footer>
</section>
<script>
(()=>{
const root=document.getElementById('player-concept'),q=s=>root.querySelector(s);
const state={dark:false,accent:'#777777',line:'straight'};
const restore=s=>{if(s&&typeof s.dark==='boolean'){state.dark=s.dark;if(/^#[0-9a-f]{6}$/i.test(s.accent||''))state.accent=s.accent;if(['straight','wave'].includes(s.line))state.line=s.line}};
restore(window.openai?.widgetState?.privateContent);
const tracks=[['Тихий город','Север','Ночные линии',272],['После дождя','Контур','Отражения',228],['Далеко','Маяк','Горизонт',316],['Пауза','Север','Ночные линии',179],['Медленный свет','Контур','Отражения',247],['Домой','Маяк','Горизонт',205]];
const fmt=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
function icon(name){const el=document.createElement('i');el.setAttribute('data-lucide',name);el.setAttribute('aria-hidden','true');return el}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}})}
function button(label){const b=document.createElement('button');b.type='button';b.className='cursor-interaction';b.textContent=label;return b}
const volumeButton=button('');volumeButton.classList.add('volume-button');volumeButton.id='pc-volume-button';volumeButton.setAttribute('aria-label','Громкость');volumeButton.setAttribute('aria-expanded','false');volumeButton.setAttribute('aria-controls','pc-volume-popover');volumeButton.append(icon('volume-2'));
const volumePopover=document.createElement('div');volumePopover.id='pc-volume-popover';volumePopover.className='volume-popover';volumePopover.hidden=true;const volumeLabel=document.createElement('label');volumeLabel.className='volume-label';volumeLabel.htmlFor='pc-volume';const volumeCaption=document.createElement('span');volumeCaption.textContent='Громкость';const volumeValue=document.createElement('span');volumeValue.textContent='70%';volumeLabel.append(volumeCaption,volumeValue);const volumeInput=document.createElement('input');volumeInput.type='range';volumeInput.id='pc-volume';volumeInput.min=0;volumeInput.max=100;volumeInput.value=70;volumeInput.setAttribute('aria-label','Громкость');volumeInput.setAttribute('aria-valuetext','70 процентов');volumePopover.append(volumeLabel,volumeInput);q('.controls').append(volumeButton,volumePopover);
function closeVolume(){volumePopover.hidden=true;volumeButton.setAttribute('aria-expanded','false')}
volumeButton.onclick=()=>{const open=volumePopover.hidden;volumePopover.hidden=!open;volumeButton.setAttribute('aria-expanded',open);if(open)volumeInput.focus()};volumeInput.oninput=()=>{const v=Number(volumeInput.value);volumeValue.textContent=v+'%';volumeInput.setAttribute('aria-valuetext',v+' процентов');volumeButton.replaceChildren(icon(v===0?'volume-x':v<50?'volume-1':'volume-2'));icons()};
root.addEventListener('click',e=>{if(!volumePopover.contains(e.target)&&!volumeButton.contains(e.target))closeVolume()});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!volumePopover.hidden){closeVolume();volumeButton.focus()}});
let current=0,playing=false,mode=0;
function closeMenus(){root.querySelectorAll('.track-menu').forEach(m=>m.hidden=true);root.querySelectorAll('.menu-toggle').forEach(b=>b.setAttribute('aria-expanded','false'))}
function choose(index){current=(index+tracks.length)%tracks.length;const t=tracks[current];q('#pc-title').textContent=t[0];q('#pc-artist').textContent=t[1];q('#pc-duration').textContent=fmt(t[3]);q('#pc-seek').max=t[3];q('#pc-seek').value=0;updateSeek();root.querySelectorAll('.track').forEach(r=>r.classList.toggle('current',Number(r.dataset.trackIndex)===current))}
tracks.forEach((t,index)=>{const row=document.createElement('div');row.className='track'+(index===0?' current':'');const cover=document.createElement('div');cover.className='cover'+(index%2?' alt':'');cover.append(icon('music-2'));const details=document.createElement('div'),name=document.createElement('div'),meta=document.createElement('div');name.className='song';name.textContent=t[0];meta.className='muted';meta.textContent=t[1]+' · '+t[2];details.append(name,meta);const duration=document.createElement('span');duration.className='muted duration';duration.textContent=fmt(t[3]);const toggle=button('');toggle.classList.add('menu-toggle');toggle.setAttribute('aria-label','Меню трека '+t[0]);toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-controls','pc-track-menu-'+index);toggle.append(icon('menu'));const menu=document.createElement('div');menu.className='track-menu';menu.id='pc-track-menu-'+index;menu.hidden=true;for(const label of ['Играть следующим','Добавить в очередь','Добавить в плейлист','Сведения о треке']){const action=button(label);action.onclick=()=>{q('#pc-status').textContent=label+': '+t[0];closeMenus()};menu.append(action)}toggle.onclick=()=>{const open=menu.hidden;closeMenus();menu.hidden=!open;toggle.setAttribute('aria-expanded',open)};cover.onclick=()=>choose(index);row.append(cover,details,duration,toggle,menu);q('#pc-tracks').append(row)});
let wave='M 0 9';for(let x=1;x<=460;x++)wave+=' L '+x+' '+(9-5*Math.sin(x*Math.PI/20)).toFixed(3);q('#pc-wave-path').setAttribute('d',wave);q('#pc-wave-base').setAttribute('d',wave);
function updateSeek(){const input=q('#pc-seek'),v=Number(input.value),ratio=v/Number(input.max),width=input.getBoundingClientRect().width,thumbX=10+ratio*Math.max(0,width-20),x=width?thumbX/width*460:ratio*460; q('#pc-time').textContent=fmt(v);q('.filled').style.width=thumbX+'px';q('.seek-thumb').style.left=thumbX+'px';q('.seek-thumb').style.top=(state.line==='wave'?14-5*Math.sin(x*Math.PI/20):14)+'px';const path=q('#pc-wave-path'),total=path.getTotalLength();path.style.strokeDasharray=total;path.style.strokeDashoffset=total*(1-x/460);input.setAttribute('aria-valuetext',Math.floor(v/60)+' мин '+v%60+' сек')}
function render(){for(const [k,v] of Object.entries(state.dark?{bg:'#101112',panel:'#1d1f21',ink:'#eee',dim:'#aaa',line:'#343638'}:{bg:'#f4f4f4',panel:'#fff',ink:'#202020',dim:'#747474',line:'#dedede'}))root.style.setProperty('--'+k,v);root.style.setProperty('--accent',state.accent);q('#pc-theme').setAttribute('aria-checked',state.dark);q('#pc-theme .thumb').replaceChildren(icon(state.dark?'moon':'sun'));q('#pc-wave').hidden=state.line!=='wave';q('.rail').hidden=state.line==='wave';q('.filled').hidden=state.line==='wave';q('#pc-line-style').value=state.line;q('#pc-accent').value=state.accent;icons()}
const originalRender=render;render=()=>{originalRender();root.style.setProperty('--wave-ink',state.dark?'#ffffff':'#000000');root.style.setProperty('--knob-edge',state.dark?'#ffffff':'#171717');root.style.setProperty('--knob-fill',state.dark?'#171717':'#ffffff');updateSeek()};
function save(){window.openai?.setWidgetState({modelContent:{theme:state.dark?'dark':'light',accent:state.accent,progressLine:state.line},privateContent:state})?.catch(()=>{})}
render();updateSeek();
q('#pc-theme').onclick=()=>{state.dark=!state.dark;render();save()};q('#pc-seek').oninput=updateSeek;
q('#pc-play').onclick=()=>{playing=!playing;q('#pc-play').replaceChildren(icon(playing?'pause':'play'));q('#pc-play').setAttribute('aria-label',playing?'Пауза':'Пуск');q('#pc-status').textContent=playing?'Пример состояния: воспроизведение':'На паузе';icons()};
q('#pc-prev').onclick=()=>choose(current-1);q('#pc-next').onclick=()=>choose(current+1);
q('#pc-mode').onclick=()=>{mode=(mode+1)%3;const labels=['По порядку','Перемешивание','Повтор трека'];q('#pc-mode').replaceChildren(icon(['list-music','shuffle','repeat-1'][mode]));q('#pc-mode').setAttribute('aria-label',labels[mode]);q('#pc-status').textContent=labels[mode];icons()};
let activeList=q('#pc-all');
function filterTracks(){const all=activeList.id==='pc-all',term=q('#pc-search').value.trim().toLocaleLowerCase('ru');let count=0;root.querySelectorAll('.track').forEach(r=>{const index=Number(r.dataset.trackIndex);r.hidden=(!all&&index>1)||!tracks[index].slice(0,3).join(' ').toLocaleLowerCase('ru').includes(term);if(!r.hidden)count++});q('#pc-subtitle').textContent=(all?'Музыка / Local':'Плейлист')+' · '+count+' треков'}
function selectList(b){activeList=b;root.querySelectorAll('#pc-tabs [aria-pressed]').forEach(tab=>tab.setAttribute('aria-pressed',tab===b));q('#pc-heading').textContent=b.id==='pc-all'?'Моя музыка':b.textContent;filterTracks()}
q('#pc-all').onclick=()=>selectList(q('#pc-all'));q('#pc-evening').onclick=()=>selectList(q('#pc-evening'));q('#pc-home').onclick=()=>selectList(q('#pc-all'));
function setCreate(open){q('#pc-form').hidden=!open;q('#pc-search-bar').hidden=open;if(open)q('#pc-name').focus()}
function newList(){setCreate(q('#pc-form').hidden)}
q('#pc-search').oninput=filterTracks;q('#pc-cancel-list').onclick=()=>setCreate(false);
q('#pc-add').onclick=newList;q('#pc-add-side').onclick=newList;
q('#pc-form').onsubmit=e=>{e.preventDefault();const name=q('#pc-name').value.trim();if(!name)return;const b=button(name);b.setAttribute('aria-pressed','false');b.onclick=()=>selectList(b);q('#pc-add').before(b);setCreate(false);q('#pc-name').value='';selectList(b)};
function settings(open){q('#pc-settings-panel').hidden=!open;q('#pc-settings').setAttribute('aria-expanded',open)}
q('#pc-settings').onclick=()=>settings(q('#pc-settings-panel').hidden);q('#pc-close-settings').onclick=()=>settings(false);
q('#pc-line-style').onchange=e=>{state.line=e.target.value;render();save()};q('#pc-accent').oninput=e=>{state.accent=e.target.value;render();save()};
root.addEventListener('click',e=>{if(!e.target.closest('.menu-toggle')&&!e.target.closest('.track-menu'))closeMenus()});root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenus();settings(false)}});
let drag=null,suppressClick=false;
root.querySelectorAll('.track').forEach((row,index)=>{row.dataset.trackIndex=index;const handle=row.querySelector('.menu-toggle');handle.setAttribute('aria-description','Нажмите для меню или перетащите для изменения порядка. Alt и стрелки вверх или вниз также меняют порядок.');handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={row,handle,x:e.clientX,y:e.clientY,moved:false};handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag||drag.handle!==handle)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;drag.moved=true;closeMenus();row.classList.add('dragging');const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.track');if(target&&target!==row&&root.contains(target)&&!target.hidden){const box=target.getBoundingClientRect();if(e.clientY<box.top+box.height/2)target.before(row);else target.after(row)}});function finish(){if(!drag||drag.handle!==handle)return;row.classList.remove('dragging');if(drag.moved){suppressClick=true;q('#pc-status').textContent='Порядок треков изменён';setTimeout(()=>suppressClick=false,0)}drag=null}handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);handle.addEventListener('keydown',e=>{if(!e.altKey||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const neighbor=e.key==='ArrowUp'?row.previousElementSibling:row.nextElementSibling;if(!neighbor)return;if(e.key==='ArrowUp')neighbor.before(row);else neighbor.after(row);handle.focus();q('#pc-status').textContent='Порядок треков изменён'})});
root.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false}},true);
new ResizeObserver(updateSeek).observe(q('.seek'));
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{render();save()}});t.addToggle(state,'dark',{label:'Тёмная тема'});t.addColorPicker(state,'accent',{label:'Акцент'});t.addSelect(state,'line',{label:'Шкала',options:[{label:'Прямая',value:'straight'},{label:'Волнистая',value:'wave'}]})}
window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.privateContent);render()});
})();
</script>
</div>
